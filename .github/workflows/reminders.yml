name: Chore reminders

# Sends push notifications for chores that are due. Runs every hour; each
# flatmate picks their reminder hours in the app (Flat -> Reminders), and the
# job only reminds the people whose hours match, in the flat's time zone.
# GitHub may start scheduled runs some minutes late.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log how many reminders would be sent (manual runs remind everyone, whatever their hours)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reminders/package-lock.json
      - run: npm ci
        working-directory: reminders
      - run: node send.mjs
        working-directory: reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SCHEDULE: ${{ github.event.schedule }}
