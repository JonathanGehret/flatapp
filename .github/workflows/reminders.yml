name: Chore reminders

# Sends push notifications for chores that are due, at 08:00 and 18:00 Berlin
# time. GitHub's cron is in UTC and ignores daylight saving time, so this
# fires at both UTC hours that can match (summer and winter) and send.mjs
# skips the one that does not. Change the times with REMINDER_TZ and
# REMINDER_HOURS below, and adjust the cron hours to cover them.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log how many reminders would be sent
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reminders/package-lock.json
      - run: npm ci
        working-directory: reminders
      - run: node send.mjs
        working-directory: reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SCHEDULE: ${{ github.event.schedule }}
          REMINDER_TZ: Europe/Berlin
          REMINDER_HOURS: '8,18'
