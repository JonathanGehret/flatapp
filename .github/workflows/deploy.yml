name: Deploy

# Publishes the app (web/) and the Firestore rules whenever they change on the
# default branch. Uses the same FIREBASE_SERVICE_ACCOUNT secret as the
# reminder job; that service account needs permission to deploy Hosting and
# Firestore rules (see README).
on:
  push:
    branches: [main]
    paths: ['web/**', 'firestore.rules', 'firebase.json', '.firebaserc', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Deploy Hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --non-interactive
