[package]
name = "flatapp"
version = "0.1.0"
edition = "2021"
description = "Shared chore planner for flats: a Rust server with an embedded PWA"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.8"
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
